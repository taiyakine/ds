<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeepSeek</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:serif;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  #wrap{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
  }
  .row{
    white-space:nowrap;
    font-size:14vw;
    line-height:1.1;
    font-weight:bold;
    /* 整面渐变：从亮红到近黑 */
    background:linear-gradient(to bottom, #ff0000, #000000);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:2px;
  }
  #track{
    animation:swing 4s linear infinite;
  }
  @keyframes swing{
    0%{transform:translateY(0);}
    50%{transform:translateY(-50%);}
    100%{transform:translateY(0);}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="track"></div>
</div>
<script>
  const track = document.getElementById('track');
  let html = '';
  for(let i=0;i<20;i++){
    html += '<div class="row">DeepSeek</div>';
  }
  // 复制两份，确保上下滚动无缝衔接
  track.innerHTML = html + html;
</script>
</body>
</html>
