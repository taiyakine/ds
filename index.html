<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeepSeek</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:serif;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  #wrap{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;
  }
  #track{
    display:flex;
    flex-direction:column;
    align-items:center;
    /* 8秒一个完整的来回循环 */
    animation:swing 8s linear infinite;
  }
  .row{
    white-space:nowrap;
    /* 字号拉到最大，几乎占满屏 */
    font-size:18vw;
    line-height:1.15;
    font-weight:bold;
    /* 整体渐变：从亮红到暗红再到黑，一体成型，不分层 */
    background: linear-gradient(to bottom, #ff0000 0%, #ff0044 40%, #000000 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing:4px;
  }
  @keyframes swing{
    0%{transform:translateY(0);}
    50%{transform:translateY(-50%);}
    100%{transform:translateY(0);}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="track"></div>
</div>
<script>
  const track = document.getElementById('track');
  let html = '';
  // 这里只放一行字，撑满屏幕
  for(let i=0;i<30;i++){
    html += '<div class="row">DeepSeek</div>';
  }
  // 复制两份，保证来回滚动时中间没有断层
  track.innerHTML = html + html;
</script>
</body>
</html>
