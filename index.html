<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeepSeek</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:serif;
  }
  #wrap{
    position:fixed;
    inset:0;
    overflow:hidden;
  }
  #track{
    display:flex;
    flex-direction:column;
    animation:scrollDown 10s linear infinite;
  }
  .row{
    white-space:nowrap;
    font-size:14vw;
    line-height:1.05;
    font-weight:bold;
    color:#ff0000;
    text-align:center;
    letter-spacing:2px;
  }
  #track{
    -webkit-mask-image:linear-gradient(to bottom, #fff 0%, #fff 60%, transparent 100%);
    mask-image:linear-gradient(to bottom, #fff 0%, #fff 60%, transparent 100%);
  }
  .row{
    -webkit-background-clip:text;
    background-clip:text;
  }
  @keyframes scrollDown{
    from{transform:translateY(0);}
    to{transform:translateY(-50%);}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="track"></div>
</div>
<script>
  const track = document.getElementById('track');
  let html = '';
  for(let i=0;i<20;i++){
    html += '<div class="row">DeepSeek</div>';
  }
  track.innerHTML = html + html;
</script>
</body>
</html>
