<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeepSeek</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:serif;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  #wrap{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;
  }
  #track{
    display:flex;
    flex-direction:column;
    animation:swing 10s linear infinite;
  }
  .row{
    white-space:nowrap;
    font-size:14vw;
    line-height:1.1;
    font-weight:bold;
    color:#ff0000;
    text-shadow:0 0 10px #ff0000;
  }
  /* 整面渐变：靠外层遮罩叠黑色渐变，所有行一起变暗 */
  #mask{
    position:fixed;
    inset:0;
    background:linear-gradient(to bottom, transparent 0%, transparent 30%, #000 70%, #000 100%);
    pointer-events:none;
  }
  @keyframes swing{
    0%{transform:translateY(0);}
    50%{transform:translateY(-50%);}
    100%{transform:translateY(0);}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="track"></div>
</div>
<div id="mask"></div>
<script>
  const track = document.getElementById('track');
  let html = '';
  for(let i=0;i<30;i++){
    html += '<div class="row">DeepSeek</div>';
  }
  track.innerHTML = html + html;
</script>
</body>
</html>
