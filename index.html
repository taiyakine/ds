<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeepSeek</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:monospace;
  }
  .layer{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    animation:scrollDown 1.5s linear infinite;
  }
  #back{
    opacity:0.25;
    filter:blur(1px);
    animation-duration:3s;
    animation-direction:reverse;
  }
  #back .row{
    color:#ff0044;
    font-size:20px;
    text-shadow:0 0 4px #ff0044;
  }
  #front .row{
    color:red;
    font-size:22px;
    text-shadow:0 0 8px red;
    animation:glitch 0.08s infinite;
  }
  .row{
    white-space:nowrap;
    line-height:1.1;
  }
  @keyframes scrollDown{
    from{transform:translateY(-50%);}
    to{transform:translateY(0);}
  }
  @keyframes glitch{
    0%{transform:translate(0,0);opacity:0.8;}
    50%{transform:translate(-2px,1px);opacity:1;}
    100%{transform:translate(2px,-1px);opacity:0.7;}
  }
</style>
</head>
<body>
<div class="layer" id="back"></div>
<div class="layer" id="front"></div>
<script>
  function fill(el){
    let html = '';
    for(let i=0;i<200;i++){
      let s = '';
      for(let j=0;j<80;j++){
        s += 'DeepSeek' + (Math.random()>0.5 ? ' ' : '');
      }
      html += '<div class="row">'+s+'</div>';
    }
    el.innerHTML = html + html;
  }
  fill(document.getElementById('back'));
  fill(document.getElementById('front'));
</script>
</body>
</html>
