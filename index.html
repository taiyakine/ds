<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeepSeek</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:monospace;
  }
  #wrap{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    animation:scrollDown 1.2s linear infinite;
  }
  .row{
    white-space:nowrap;
    line-height:1.15;
    font-size:34px;
    color:#ff0000;
    text-shadow:0 0 8px #ff0000;
  }
  /* 越往下颜色越暗，形成从深到浅的循环 */
  .row:nth-child(6n+1){color:#ff0000;}
  .row:nth-child(6n+2){color:#cc0000;}
  .row:nth-child(6n+3){color:#990000;}
  .row:nth-child(6n+4){color:#660000;}
  .row:nth-child(6n+5){color:#330000;}
  .row:nth-child(6n+6){color:#110000;}
  @keyframes scrollDown{
    from{transform:translateY(0);}
    to{transform:translateY(-33.333%);}
  }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
  const wrap = document.getElementById('wrap');
  let html = '';
  for(let i=0;i<150;i++){
    let s = '';
    for(let j=0;j<60;j++){
      s += 'DeepSeek' + (Math.random()>0.5 ? ' ' : '');
    }
    html += '<div class="row">'+s+'</div>';
  }
  wrap.innerHTML = html + html + html;
</script>
</body>
</html>
