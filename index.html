<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeepSeek</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:monospace;
  }
  #wrap{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    animation:scrollDown 8s linear infinite;
  }
  .row{
    white-space:nowrap;
    line-height:1.15;
    font-size:34px;
    color:transparent;
    background:linear-gradient(to bottom,#ff0000,#000000);
    -webkit-background-clip:text;
    background-clip:text;
  }
  @keyframes scrollDown{
    from{transform:translateY(-50%);}
    to{transform:translateY(0);}
  }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
  const wrap = document.getElementById('wrap');
  let html = '';
  for(let i=0;i<120;i++){
    let s = '';
    for(let j=0;j<60;j++){
      s += 'DeepSeek' + (Math.random()>0.5 ? ' ' : '');
    }
    html += '<div class="row">'+s+'</div>';
  }
  // 复制两份，滚一半无缝循环
  wrap.innerHTML = html + html;
</script>
</body>
</html>
