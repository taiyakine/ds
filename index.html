<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeepSeek</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:monospace;
  }
  .layer{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    animation:swing 6s ease-in-out infinite;
  }
  #back{
    opacity:0.2;
    filter:blur(2px);
    animation-duration:8s;
    animation-direction:reverse;
    font-size:26px;
  }
  #front{
    font-size:34px;
  }
  .row{
    white-space:nowrap;
    line-height:1.15;
    color:#ff0000;
  }
  /* 整面平滑渐变：越往下越暗，循环周期覆盖全部行 */
  #front .row{
    color:transparent;
    background:linear-gradient(to bottom, #ff0000, #000000);
    -webkit-background-clip:text;
    background-clip:text;
  }
  #back .row{
    color:#ff0044;
  }
  @keyframes swing{
    0%{transform:translateY(0);}
    50%{transform:translateY(-50%);}
    100%{transform:translateY(0);}
  }
</style>
</head>
<body>
<div class="layer" id="back"></div>
<div class="layer" id="front"></div>
<script>
  function fill(el){
    let html = '';
    for(let i=0;i<150;i++){
      let s = '';
      for(let j=0;j<60;j++){
        s += 'DeepSeek' + (Math.random()>0.5 ? ' ' : '');
      }
      html += '<div class="row">'+s+'</div>';
    }
    el.innerHTML = html + html;
  }
  fill(document.getElementById('back'));
  fill(document.getElementById('front'));
</script>
</body>
</html>
