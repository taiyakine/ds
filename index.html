<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeepSeek</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:monospace;
  }
  #wrap{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    animation:loop 2.5s ease-in-out infinite;
  }
  .row{
    white-space:nowrap;
    line-height:1.15;
    font-size:34px;
    color:#ff0000;
    text-shadow:0 0 10px #ff0000,0 0 20px #ff0000;
  }
  @keyframes loop{
    0%{transform:translateY(0);}
    50%{transform:translateY(-50%);}
    100%{transform:translateY(0);}
  }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
  const wrap = document.getElementById('wrap');
  let html = '';
  for(let i=0;i<150;i++){
    let s = '';
    for(let j=0;j<40;j++){
      s += 'DeepSeek' + (Math.random()>0.5 ? ' ' : '');
    }
    html += '<div class="row">'+s+'</div>';
  }
  // 复制两份，滚一半就能无缝接回开头
  wrap.innerHTML = html + html;
</script>
</body>
</html>
