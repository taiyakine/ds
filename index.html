<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeepSeek</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:serif;
  }
  #stage{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
  }
  #track{
    display:flex;
    flex-direction:column;
    animation:roll 12s linear infinite;
  }
  .row{
    white-space:nowrap;
    font-size:16vw;
    line-height:1.1;
    font-weight:bold;
    color:#ff0000;
    text-shadow:0 0 12px #ff0000;
    letter-spacing:2px;
  }
  /* 整面统一渐变遮罩：上下暗、中间亮，所有行一起变 */
  #mask{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:linear-gradient(
      to bottom,
      #000 0%,
      transparent 25%,
      transparent 75%,
      #000 100%
    );
  }
  @keyframes roll{
    0%{transform:translateY(0);}
    50%{transform:translateY(-50%);}
    100%{transform:translateY(0);}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="track"></div>
</div>
<div id="mask"></div>
<script>
  const track = document.getElementById('track');
  let html = '';
  for(let i=0;i<30;i++){
    html += '<div class="row">DeepSeek</div>';
  }
  // 复制两份，保证上下滚动无缝衔接
  track.innerHTML = html + html;
</script>
</body>
</html>
