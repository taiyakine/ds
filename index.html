<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeepSeek</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:monospace;
  }
  #wrap{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    animation:scrollDown 2s linear infinite;
  }
  .row{
    white-space:nowrap;
    line-height:1.15;
    font-size:34px;
    color:#ff0000;
  }
  /* 每4行一循环，形成整面平滑渐变 */
  .row:nth-child(4n+1){color:#ff0000;}
  .row:nth-child(4n+2){color:#cc0000;}
  .row:nth-child(4n+3){color:#880000;}
  .row:nth-child(4n+4){color:#440000;}
  @keyframes scrollDown{
    from{transform:translateY(0);}
    to{transform:translateY(-25%);}
  }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
  const wrap = document.getElementById('wrap');
  let html = '';
  for(let i=0;i<150;i++){
    let s = '';
    for(let j=0;j<60;j++){
      s += 'DeepSeek' + (Math.random()>0.5 ? ' ' : '');
    }
    html += '<div class="row">'+s+'</div>';
  }
  // 复制四份，滚四分之一就无缝接上，像竖直的圈一直转
  wrap.innerHTML = html + html + html + html;
</script>
</body>
</html>
